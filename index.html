<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лассо Ранчо 🤠</title>
<style>
:root{--gold:#ffcf3f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#120b06;color:#f6ead7;font-family:"Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;height:100vh;user-select:none;-webkit-user-select:none}
#app{display:flex;height:100vh}
/* ---------- игровая зона ---------- */
#gameWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,#4a2f17 0%,#24160b 55%,#110a05 100%)}
#gameWrap::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 9px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 23px)}
#frame{position:relative;width:100%;max-width:calc((100vh - 32px - 24px)*1.5 + 24px);padding:12px;border-radius:22px;
  background:linear-gradient(145deg,#9a6636 0%,#6b4020 35%,#4a2a12 70%,#3a200c 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 0 2px #1e1107,inset 0 2px 0 rgba(255,220,170,.35),inset 0 -4px 0 rgba(0,0,0,.45)}
#frame::before{content:"";position:absolute;inset:5px;border-radius:18px;border:2px dashed rgba(255,214,150,.22);pointer-events:none}
.nail{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f2e2c4,#8a7458 60%,#3b2e20);box-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
#c{width:100%;height:auto;display:block;border-radius:12px;cursor:crosshair;touch-action:none;box-shadow:0 0 0 3px #2a170a,0 0 0 5px rgba(255,210,150,.15)}
#toast{position:absolute;top:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9;width:90%}
#toast .t{background:linear-gradient(180deg,rgba(40,26,14,.92),rgba(22,14,7,.92));border:2px solid #ffcf3f;padding:8px 18px;border-radius:999px;font-weight:800;font-size:15px;
  transition:opacity .5s,transform .5s;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);animation:tIn .35s cubic-bezier(.3,1.6,.5,1);backdrop-filter:blur(4px)}
@keyframes tIn{from{transform:translateY(-14px) scale(.85);opacity:0}}
#toast .t.out{opacity:0;transform:translateY(-10px)}
/* ---------- панель ---------- */
#panel{width:370px;flex-shrink:0;overflow-y:auto;padding:16px 16px 20px;position:relative;
  background:linear-gradient(180deg,#3d2815 0%,#2a1b0e 45%,#1c1209 100%);box-shadow:inset 5px 0 0 #5c3d22,inset 8px 0 22px rgba(0,0,0,.55)}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-thumb{background:#6b4a2b;border-radius:8px}
.card{background:linear-gradient(180deg,rgba(255,236,200,.08),rgba(255,236,200,.025));border:1px solid rgba(255,220,170,.14);border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.moneyBox{padding:14px 14px 12px;text-align:center;position:relative;overflow:hidden}
.moneyBox::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);animation:sweep 5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.money{display:flex;align-items:center;justify-content:center;gap:10px}
.money .num{font-size:38px;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#fff6c2 0%,#ffd84a 45%,#e8960c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5e3a05) drop-shadow(0 0 14px rgba(255,200,60,.25));font-variant-numeric:tabular-nums}
.money.bump .num{animation:bump .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{from{transform:scale(1.18)}}
.coin{width:38px;height:38px;animation:coin 3.2s ease-in-out infinite;filter:drop-shadow(0 3px 0 #5e3a05)}
@keyframes coin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
.incChip{display:inline-flex;align-items:center;gap:5px;margin-top:4px;background:rgba(80,200,70,.14);border:1px solid rgba(120,240,100,.3);color:#a6ff8e;font-weight:900;font-size:14px;padding:3px 12px;border-radius:999px}
.sub{font-size:12px;opacity:.65;margin-top:6px;font-weight:700}
#mute{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:17px;cursor:pointer;width:34px;height:34px;z-index:2}
.lassoInfo{padding:11px 12px;margin-top:12px;display:flex;gap:12px;align-items:center}
.lassoInfo .ln{font-weight:900;font-size:16px;margin-bottom:5px}
.statRow{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:12px 0;padding:4px;background:rgba(0,0,0,.38);border-radius:15px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.tabs button{flex:1;padding:10px 2px;border:none;border-radius:11px;background:transparent;color:#d8c09e;font-weight:900;cursor:pointer;font-size:12px;white-space:nowrap;font-family:inherit;transition:background .2s,color .2s}
.tabs button:hover{color:#fff}
.tabs button.active{background:linear-gradient(180deg,#ffdf6e,#f2a51a);color:#3b2410;box-shadow:0 3px 0 #a3650a,0 6px 12px rgba(0,0,0,.3)}
.tab{display:none}.tab.active{display:block;animation:fadeUp .25s}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
/* ---------- кнопки ---------- */
.btn{--sh:#a3650a;border:none;border-radius:10px;padding:7px 12px;font-weight:900;cursor:pointer;font-size:12.5px;font-family:inherit;color:#3b2410;
  background:linear-gradient(180deg,#ffe68a,#f5b324);box-shadow:0 3px 0 var(--sh),0 6px 12px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,filter .15s;position:relative}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--sh),0 2px 4px rgba(0,0,0,.3)}
.btn:disabled{background:linear-gradient(180deg,#75624e,#5a4a3b);color:#2e241a;--sh:#3a2f25;cursor:not-allowed}
.btn.green{--sh:#24701c;background:linear-gradient(180deg,#9df78a,#41b737);color:#0f2e0b}
.btn.red{--sh:#86231a;background:linear-gradient(180deg,#ff9686,#df4a39);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.big{padding:13px 16px;font-size:16px;border-radius:14px;box-shadow:0 5px 0 var(--sh),0 10px 18px rgba(0,0,0,.3)}
.btn.big:active:not(:disabled){transform:translateY(5px)}
/* ---------- клетки ---------- */
.cages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cage{--rc:#6b4a2b;--glow:transparent;position:relative;border-radius:16px;min-height:184px;padding:30px 7px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,220,150,.12),transparent 60%),linear-gradient(180deg,#4b3220 0%,#3a2617 58%,#d2a556 58%,#b3843a 78%,#93682a 100%);
  border:3px solid var(--rc);box-shadow:0 0 0 2px #160d06,0 8px 16px rgba(0,0,0,.45),0 0 20px -2px var(--glow)}
.cage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(18,10,4,.6) 17px 20px,rgba(255,240,210,.14) 20px 21px,transparent 21px 22px)}
.cage::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;z-index:3;background:linear-gradient(#8a6038,#4a2f18);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.cage .straw{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:0;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 5px,rgba(255,230,150,.35) 5px 6px,transparent 6px 11px),repeating-linear-gradient(65deg,transparent 0 7px,rgba(120,80,20,.35) 7px 8px,transparent 8px 13px)}
.cage .e{font-size:46px;line-height:1;position:relative;z-index:1;margin:2px 0 4px}
.cage .e>span{display:inline-block;animation:idle 2.2s ease-in-out infinite;filter:drop-shadow(0 5px 3px rgba(0,0,0,.45))}
.cage .e>span.mut-gold,.cage .e>span.mut-diamond{filter:var(--mf) drop-shadow(0 5px 3px rgba(0,0,0,.45))}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-6px) scale(.97,1.04)}55%{transform:translateY(-6px) scale(.97,1.04)}}
.cage .meta{position:relative;z-index:4;background:rgba(18,11,5,.82);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 5px 6px;width:100%}
.cage .nm{font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cage .ic{font-size:11.5px;color:#9dff7a;font-weight:900}
.cage .od{font-size:10px;opacity:.75;font-weight:800}
.cage .meta .btn{margin-top:5px;padding:4px 8px;font-size:11px;width:100%}
.cage .rp{position:absolute;top:14px;left:6px;z-index:4;font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:6px;color:#1a120b;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cage.empty .hint2{position:relative;z-index:4;font-size:12px;font-weight:800;opacity:.7;margin-bottom:24px}
.cage.empty .e{opacity:.35;filter:grayscale(.4)}
.cage.locked{background:linear-gradient(180deg,#2a1d11,#1c130a);border-style:dashed;border-color:#5a4028}
.cage.locked::before{background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(0,0,0,.4) 17px 20px)}
.cage.locked .lk{font-size:36px;position:relative;z-index:4;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6));margin-bottom:6px}
.cage.locked .meta{background:transparent;border:none}
.cage.dim{opacity:.4}
.cash{position:absolute;z-index:5;top:38%;left:50%;font-weight:900;color:#a6ff8e;font-size:13px;text-shadow:0 2px 0 #000,0 0 8px rgba(120,255,90,.6);pointer-events:none;animation:cashUp 1.5s ease-out forwards;white-space:nowrap}
@keyframes cashUp{0%{transform:translate(-50%,6px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-44px) scale(1);opacity:0}}
/* ---------- магазин ---------- */
.shopItem{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;border-radius:15px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,236,200,.07),rgba(255,236,200,.02));border:1px solid rgba(255,220,170,.12)}
.shopItem.cur{border:2px solid #ffcf3f;box-shadow:0 0 18px -4px #ffcf3f}
.shopItem.next{border:2px solid rgba(255,207,63,.45)}
.shopItem.lock{opacity:.45}
.ico{width:44px;height:44px;border-radius:50%;flex-shrink:0;border:3px solid;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 8px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.35)}
.shopItem .info{flex:1;font-size:11px;font-weight:700;opacity:.95;min-width:0}
.shopItem .info b{font-size:14px;display:block;font-weight:900}
.prog{height:6px;border-radius:6px;background:rgba(0,0,0,.4);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#f5b324,#ffe68a);transition:width .3s}
/* ---------- справочник ---------- */
.book{display:flex;flex-direction:column;gap:6px}
.bookRow{display:flex;align-items:center;gap:9px;border-radius:12px;padding:6px 10px 6px 8px;font-size:12px;border-left:5px solid;
  background:linear-gradient(90deg,rgba(255,236,200,.07),rgba(255,236,200,.02))}
.bookRow .e{font-size:28px;width:38px;text-align:center;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.bookRow .e.unk{filter:brightness(0) opacity(.55)}
.bookRow .i{flex:1;font-weight:700}
.bookRow .i b{font-size:13px;font-weight:900}
.bookRow .pc{font-weight:900;text-align:right;font-size:11.5px;white-space:nowrap}
.rarTag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:900;color:#1a120b}
.hint{font-size:12px;opacity:.75;margin-top:10px;line-height:1.5;font-weight:600}
/* ---------- мутации ---------- */
.gold,.mut-gold{--mf:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15);filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px #ffd84a)}
.mut-diamond{--mf:grayscale(1) sepia(1) hue-rotate(150deg) saturate(3) brightness(1.35);filter:grayscale(1) sepia(1) hue-rotate(150deg) saturate(3) brightness(1.35) drop-shadow(0 0 7px #67e8f9)}
.mut-rainbow{animation:rbw 1.5s linear infinite!important}
@keyframes rbw{from{filter:saturate(2.2) hue-rotate(0deg) drop-shadow(0 0 7px #ff5ec8)}to{filter:saturate(2.2) hue-rotate(360deg) drop-shadow(0 0 7px #ff5ec8)}}
.mutTag{display:inline-block;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:900;color:#1a120b;margin:3px 0}
.mutTag.rainbow{background:linear-gradient(90deg,#ff5e5e,#ffd84a,#5ee36b,#5ec8ff,#c084fc,#ff5ec8)!important;background-size:200% 100%!important;animation:slide 2s linear infinite}
@keyframes slide{to{background-position:200% 0}}
/* ---------- модалка поимки ---------- */
#modal{position:fixed;inset:0;background:radial-gradient(circle,rgba(20,10,0,.55),rgba(0,0,0,.8));display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(3px)}
#modal.hidden{display:none}
.mBox{--rc:#ffcf3f;position:relative;background:linear-gradient(180deg,#523720,#2c1c0f);border:3px solid var(--rc);border-radius:24px;padding:20px 22px 22px;width:min(410px,92vw);text-align:center;
  animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-height:92vh;overflow:auto;box-shadow:0 0 0 4px #1a0f06,0 0 50px -6px var(--rc),0 30px 60px rgba(0,0,0,.6)}
@keyframes pop{from{transform:scale(.5) rotate(-4deg);opacity:0}to{transform:scale(1);opacity:1}}
.mStage{position:relative;height:150px;display:flex;align-items:center;justify-content:center;margin:-4px -22px 4px;overflow:hidden}
.mRays{position:absolute;left:50%;top:50%;width:460px;height:460px;margin:-230px 0 0 -230px;opacity:.55;
  background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 24deg);animation:spin 10s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
.mGlow{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 65%);opacity:.6;animation:pulseG 1.4s ease-in-out infinite alternate}
@keyframes pulseG{to{transform:scale(1.2);opacity:.85}}
.mEmoji{position:relative;font-size:96px;line-height:1;animation:wig 1.3s ease-in-out infinite}
.mEmoji>span{display:inline-block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}
@keyframes wig{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-6px)}}
.mBox h2{font-size:28px;margin:2px 0;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.newb{display:inline-block;background:linear-gradient(180deg,#ff6b6b,#d92b2b);color:#fff;font-weight:900;padding:3px 12px;border-radius:9px;font-size:12px;margin-bottom:4px;animation:pulse .7s infinite alternate;box-shadow:0 3px 0 #7a1010}
@keyframes pulse{to{transform:scale(1.1)}}
.mStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.mStats div{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 6px;font-size:11.5px;font-weight:800;opacity:.95}
.mStats b{display:block;font-size:17px;margin-top:2px}
.oddsLine{font-size:13px;opacity:.95;margin-top:6px;font-weight:800}
.oddsLine b{font-size:16px}
.mBtns{display:flex;flex-direction:column;gap:10px}
.repl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.repl .btn{--sh:#2c1a0c;background:linear-gradient(180deg,#7a5634,#5c3e22);color:#f3e6d3;font-size:12px}
.reset{margin-top:16px;width:100%;background:transparent!important;color:#a08770!important;border:1px solid #5c3d22!important;box-shadow:none!important}
/* ===== Анимация появления ===== */
#reveal{position:absolute;inset:0;pointer-events:none;z-index:8;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transition:opacity .35s}
#reveal.on{opacity:1}
#reveal .rv-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.82) 70%)}
#reveal .rv-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(from 0deg,var(--c) 0deg 7deg,transparent 7deg 22deg);opacity:.0;
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 45%);mask:radial-gradient(circle,#000 0%,transparent 45%);
  animation:spin 9s linear infinite;transition:opacity .6s}
#reveal.on .rv-rays{opacity:.5}
#reveal.rainbow .rv-rays{background:repeating-conic-gradient(from 0deg,#ff5e5e 0 6deg,transparent 6deg 12deg,#ffd84a 12deg 18deg,transparent 18deg 24deg,#5ee36b 24deg 30deg,transparent 30deg 36deg,#5ec8ff 36deg 42deg,transparent 42deg 48deg,#c084fc 48deg 54deg,transparent 54deg 60deg)}
@keyframes spin{to{transform:rotate(360deg)}}
#reveal .rv-flash{position:absolute;inset:0;background:var(--c);opacity:0}
#reveal.on .rv-flash{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#reveal .rv-content{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
#reveal .rv-top{font-weight:900;letter-spacing:4px;font-size:clamp(14px,2.4vw,24px);color:var(--c);text-shadow:0 0 12px var(--c),0 3px 0 #000;opacity:0;transform:translateY(-20px)}
#reveal.on .rv-top{animation:dropIn .45s .1s forwards}
@keyframes dropIn{to{opacity:1;transform:none}}
#reveal .rv-emoji{font-size:clamp(70px,13vw,150px);line-height:1.15;transform:scale(0) rotate(-30deg)}
#reveal.on .rv-emoji{animation:emojiIn .7s .2s cubic-bezier(.3,1.7,.5,1) forwards}
#reveal.on .rv-emoji.mutfx{animation:emojiIn .7s .2s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes emojiIn{to{transform:scale(1) rotate(0)}}
#reveal .rv-name{font-size:clamp(22px,4vw,40px);font-weight:900;color:#fff;text-shadow:0 0 14px var(--c),0 3px 0 #000;opacity:0}
#reveal.on .rv-name{animation:dropIn .4s .5s forwards}
#reveal .rv-odds{margin-top:8px;font-weight:900;color:#fff;display:flex;align-items:baseline;gap:12px;opacity:0;text-shadow:0 4px 0 #000,0 0 18px var(--c2)}
#reveal.on .rv-odds{animation:dropIn .3s .55s forwards}
#reveal .rv-one{font-size:clamp(20px,3.4vw,34px);opacity:.85}
#reveal .rv-num{font-size:clamp(40px,8vw,84px);color:var(--c2);display:inline-block;min-width:1ch;font-variant-numeric:tabular-nums}
#reveal .rv-num.slam{animation:slam .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes slam{0%{transform:scale(1.9)}100%{transform:scale(1)}}
#reveal .rv-tags{display:flex;gap:8px;margin-top:10px;opacity:0;transform:scale(.5);transition:all .35s cubic-bezier(.3,1.7,.5,1)}
#reveal .rv-tags.show{opacity:1;transform:scale(1)}
#reveal .rv-tags span{padding:4px 12px;border-radius:9px;font-weight:900;font-size:clamp(12px,1.8vw,17px);color:#1a120b;box-shadow:0 3px 0 rgba(0,0,0,.5)}
/* ===== Радужные цифры и молнии ===== */
#reveal .rv-bolt{position:absolute;inset:0;width:100%;height:100%}
#reveal .rv-white{position:absolute;inset:0;background:#fff;opacity:0}
#reveal .rv-white.go{animation:wflash .45s ease-out}
@keyframes wflash{0%{opacity:.95}15%{opacity:.2}25%{opacity:.8}100%{opacity:0}}
.rbText,#reveal .rv-num.rainbow,#reveal .rv-one.rainbow,#reveal .rv-hype{
  background:linear-gradient(90deg,#ff3b3b,#ffa53b,#fff23b,#4dff6b,#3bd8ff,#8a5cff,#ff3bd8,#ff3b3b);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;
  text-shadow:none;animation:rbText 1.1s linear infinite}
@keyframes rbText{to{background-position:200% 0}}
#reveal .rv-num.rainbow{filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 14px rgba(255,255,255,.5))}
#reveal .rv-num.rainbow.slam{animation:rbText 1.1s linear infinite,slam .5s cubic-bezier(.3,1.8,.5,1)}

  const def=pickDef(),dir=Math.random()<.5?1:-1;
  const sp=(34+def.r*11)*rand(.8,1.25);
  const mut=rollMut();
  const a={def,mut,odds:oddsOf(def,mut),hl:0,
    x:initial?rand(80,W-80):(dir>0?-50:W+50),y:rand(FIELD_TOP,FIELD_BOT),
    vx:dir*sp,vy:rand(-10,10),tt:rand(1,3),pause:0,flee:0,ph:Math.random()*10};

}
function updateAnimals(dt){
  for(const a of animals){
    if(a.hl>0)a.hl-=dt;
    a.tt-=dt;
    if(a.tt<=0){a.vy=rand(-18,18);a.pause=(a.flee<=0&&Math.random()<.18)?rand(.6,1.8):0;a.tt=rand(1.2,3.2);}
    if(a.flee>0)a.flee-=dt;
    if(a.pause>0&&a.flee<=0){a.pause-=dt;continue;}
    const d=depth(a.y),m=a.flee>0?2.4:1;
    a.x+=a.vx*dt*d*m;a.y+=a.vy*dt*m;
    if(a.y<FIELD_TOP){a.y=FIELD_TOP;a.vy=Math.abs(a.vy);}
    if(a.y>FIELD_BOT){a.y=FIELD_BOT;a.vy=-Math.abs(a.vy);}
    // пыль из-под копыт
    if(Math.random()<dt*(a.flee>0?14:3+a.def.r*.4))
      wParticles.push({x:a.x-Math.sign(a.vx)*a.def.size*d*.3+rand(-4,4),y:a.y+rand(-2,2),r:rand(2,4)*d,vr:rand(8,16)*d,life:rand(.5,.9),max:.9,vx:-Math.sign(a.vx)*rand(5,20),vy:rand(-8,-2)});
  }
  for(const a of animals)if(a.test)a.ttl=(a.dieAt-performance.now())/1000;
  animals=animals.filter(a=>a.x>-90&&a.x<W+90&&!(a.test&&a.ttl<=0));

  if(spawnT<=0&&animals.filter(a=>!a.test).length<7){spawn(false);spawnT=rand(.7,1.7);}
}

    trail.push({x:lasso.x,y:lasso.y,r:L().rad*depth(lasso.ty)*(0.35+0.65*p)});if(trail.length>7)trail.shift();
    if(p>=1)resolveThrow();
  }else if(lasso.state==='pull'||lasso.state==='back'){
    lasso.p=Math.min(1,lasso.p+dt/lasso.dur);const p=lasso.p,e=p*p*(3-2*p);
    const ex=HAND.x,ey=HAND.y-10;
    lasso.x=lasso.sx+(ex-lasso.sx)*e;
    lasso.y=lasso.sy+(ey-lasso.sy)*e-(lasso.state==='pull'?Math.sin(Math.PI*p)*90:0);
    if(trail.length)trail.shift();
    if(p>=1){
      if(lasso.state==='pull'){
        lasso.state='wait';
        const col=RAR[lasso.a.def.r].c;
        burst(HAND.x,HAND.y-40,col,lasso.a.def.r>=3?60:30);confetti(HAND.x,HAND.y-60,40+lasso.a.def.r*10);
        rings.push({x:HAND.x,y:HAND.y-40,r:10,vr:340,life:.7,max:.7,col});
        if(lasso.a.mut)burst(HAND.x,HAND.y-40,MUT[lasso.a.mut].c,40);
        cam.punch=.05;
        onCatch(lasso.a);
      }else lasso.state='idle';
    }
  }
}

function windAt(x){return Math.sin(time*1.6+x*.012)*.6+Math.sin(time*3.1+x*.031)*.25;}

function drawAnimal(c,a,x,y,s,lifted){

      c.fillStyle=g2;c.beginPath();c.moveTo(x-bw*.7,y);c.lineTo(x-bw,y-bh);c.lineTo(x+bw,y-bh);c.lineTo(x+bw*.7,y);c.closePath();c.fill();
    }

  }

  let f='';if(a.mut){const mf=MUT[a.mut].filter;f=mf==='rainbow'?`saturate(2.2) hue-rotate(${(time*240)%360}deg)`:mf;}
  c.filter=(f?f+' ':'')+'drop-shadow(0 3px 2px rgba(0,0,0,.35))';
  c.font=`${sz}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';
  c.fillStyle='#000';c.globalAlpha=1;c.fillText(d.e,0,0);c.restore();
  c.filter='none';
  if(lifted)return;
  // испуг
  if(a.flee>0){c.font=`bold ${16*s+4}px ${UIFONT}`;c.textAlign='center';c.fillStyle='#ff5a4a';c.strokeStyle='#fff';c.lineWidth=3;
    const ey=cy-sz*.7-Math.abs(Math.sin(time*12))*4;c.strokeText('!',x+sz*.3,ey);c.fillText('!',x+sz*.3,ey);}

  }

}

  c.strokeStyle=rgba(col,.9);c.lineWidth=2;
  for(let i=0;i<4;i++){const a=i*Math.PI/2+time*.8,x1=Math.cos(a)*(r*.35),y1=Math.sin(a)*(r*.26),x2=Math.cos(a)*(r*.55),y2=Math.sin(a)*(r*.41);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
  c.fillStyle=col;c.beginPath();c.arc(0,0,2.5,0,7);c.fill();
  c.restore();
  for(const [a,ch] of inside){
    const s=depth(a.y),special=a.def.r>=3||a.mut;
    const y=a.y-a.def.size*s*1.15-(special?18:0);
    const t=Math.round(ch*100)+'%',cc=ch>.6?'#7dff6b':ch>.35?'#ffe14d':'#ff6b5b';
    c.font=`900 14px ${UIFONT}`;c.textAlign='center';c.textBaseline='middle';
    const tw=c.measureText(t).width+14;
    c.fillStyle='rgba(10,6,2,.8)';c.beginPath();c.roundRect(a.x-tw/2,y-10,tw,20,10);c.fill();
    c.strokeStyle=cc;c.lineWidth=1.5;c.stroke();c.fillStyle=cc;c.fillText(t,a.x,y+1);
  }
}
function drawLights(c){
  const n=ENV.night;if(n<.03)return;
  c.save();c.globalCompositeOperation='lighter';
  // фонарь
  const fl=.85+Math.sin(time*13)*.06+Math.sin(time*7.3)*.05;
  let g=c.createRadialGradient(LANTERN.gx,LANTERN.gy,2,LANTERN.gx,LANTERN.gy,190);
  g.addColorStop(0,`rgba(255,200,110,${.55*n*fl})`);g.addColorStop(.25,`rgba(255,160,70,${.18*n*fl})`);g.addColorStop(1,'rgba(255,140,50,0)');
  c.fillStyle=g;c.beginPath();c.arc(LANTERN.gx,LANTERN.gy,190,0,7);c.fill();
  c.fillStyle=`rgba(255,235,170,${.9*n})`;c.fillRect(LANTERN.gx-6,LANTERN.gy-9,12,18);
  // светлячки
  for(const f of fireflies){const a=n*Math.max(0,Math.sin(time*2.4+f.ph));if(a<.02)continue;
    g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,9);g.addColorStop(0,`rgba(230,255,120,${a})`);g.addColorStop(1,'rgba(200,255,80,0)');
    c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,9,0,7);c.fill();}
  // ночное свечение редких животных
  for(const a of animals){if(a.test||!(a.def.r>=3||a.mut))continue;const s=depth(a.y),sz=a.def.size*s,cy=a.y-sz*.45;
    const col=a.mut==='rainbow'?`hsla(${(time*200)%360},100%,60%,`:`rgba(${hexRgb(mutCol(a.mut,RAR[a.def.r]))},`;
    g=c.createRadialGradient(a.x,cy,0,a.x,cy,sz*1.3);g.addColorStop(0,col+(.45*n)+')');g.addColorStop(1,col+'0)');
    c.fillStyle=g;c.beginPath();c.arc(a.x,cy,sz*1.3,0,7);c.fill();}
  c.restore();
}
function drawParticles(c){
  for(const p of particles){
    const a=clamp(p.life*1.6,0,1);c.globalAlpha=a;c.fillStyle=p.col;
    if(p.t==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,Math.abs(Math.sin(p.rot*1.7))+.2);c.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);c.restore();}
    else if(p.t==='star'){starPath(c,p.x,p.y,p.sz*(.7+.3*Math.sin(time*20+p.x)));c.fill();}
    else{c.beginPath();c.arc(p.x,p.y,p.sz,0,7);c.fill();}
  }
  c.globalAlpha=1;
  for(const r of rings){const k=r.life/r.max;c.globalAlpha=k;c.strokeStyle=r.col;c.lineWidth=5*k+1;ell(c,r.x,r.y,r.r,r.r*.55);c.stroke();}
  c.globalAlpha=1;
}
function drawFloats(c){
  for(const f of floats){
    const sc=f.age<.18?lerp(1.9,1,f.age/.18):1,sz=(f.big?32:22)*sc;
    c.globalAlpha=Math.min(1,f.life*1.6);c.font=`900 ${sz}px ${UIFONT}`;c.textAlign='center';c.textBaseline='middle';
    c.lineJoin='round';c.lineWidth=f.big?7:5;c.strokeStyle='rgba(0,0,0,.75)';c.strokeText(f.t,f.x,f.y);
    if(f.big){const g=c.createLinearGradient(0,f.y-sz/2,0,f.y+sz/2);g.addColorStop(0,'#fff6c2');g.addColorStop(.5,'#ffd84a');g.addColorStop(1,'#ff9a1a');c.fillStyle=g;}
    else c.fillStyle=f.col;
    c.fillText(f.t,f.x,f.y);
  }
  c.globalAlpha=1;
}
function pill(c,x,y,text,col='#fff'){
  c.font=`900 15px ${UIFONT}`;c.textAlign='left';c.textBaseline='middle';
  const tw=c.measureText(text).width+22;
  c.fillStyle='rgba(15,10,5,.6)';c.beginPath();c.roundRect(x,y-14,tw,28,14);c.fill();
  c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=1;c.stroke();
  c.fillStyle=col;c.fillText(text,x+11,y+1);return tw;
}

let lastT=performance.now(),uiT=0,saveT=0,cashT=0,shownMoney=0,prevMoney=0;
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;time+=dt;
  clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+40)c.x=-200;});
  birdT-=dt;if(birdT<=0&&ENV.night<.3){birdT=rand(14,30);const y=rand(20,70),dir=Math.random()<.5?1:-1;
    for(let i=0;i<5;i++)birds.push({x:(dir>0?-30:W+30)-dir*Math.abs(i-2)*16,y:y+Math.abs(i-2)*9,v:dir*rand(55,65),ph:rand(0,6)});}
  birds.forEach(b=>b.x+=b.v*dt);birds=birds.filter(b=>b.x>-60&&b.x<W+60);
  fireflies.forEach(f=>{f.vx+=rand(-20,20)*dt;f.vy+=rand(-20,20)*dt;f.vx=clamp(f.vx,-14,14);f.vy=clamp(f.vy,-10,10);f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<FIELD_TOP-30||f.y>FENCE_Y+30)f.vy*=-1;});
  updateAnimals(dt);updateBlocks(dt);updateLasso(dt);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;if(p.t==='conf'){p.rot+=p.vrot*dt;p.vx*=.985;}});
  particles=particles.filter(p=>p.life>0);
  if(particles.length>700)particles.splice(0,particles.length-700);
  wParticles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt;});wParticles=wParticles.filter(p=>p.life>0);
  rings.forEach(r=>{r.r+=r.vr*dt;r.life-=dt;});rings=rings.filter(r=>r.life>0);
  floats.forEach(f=>{f.y-=40*dt;f.life-=dt;f.age+=dt;});floats=floats.filter(f=>f.life>0);
  gameBolts.forEach(b=>b.life-=dt*b.decay);gameBolts=gameBolts.filter(b=>b.life>0);
  if(gameFlash>0)gameFlash=Math.max(0,gameFlash-dt*2.5);
  cam.punch*=Math.pow(.02,dt);cam.shake=Math.max(0,cam.shake-dt*2);
  S.money+=totalInc()*dt;
  uiT-=dt;if(uiT<=0){uiT=.08;updateMoneyUI();evWatch();sbTick();}
  cashT-=dt;if(cashT<=0){cashT=2;cageCash();}
  saveT-=dt;if(saveT<=0){saveT=5;save();}
  render(dt);
  requestAnimationFrame(loop);
}

function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}

}
function beep(f,d=.06,type='square',v=.04,when=0){
  if(muted)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function fanfare(r,mut){

  notes.forEach((n,i)=>beep(base*Math.pow(2,n/12),.35,'triangle',.07,i*.09));
  beep(base/2,.6,'sawtooth',.03,notes.length*.09);
}

let gameBolts=[],gameFlash=0,rvBolts=[],storm=0,boltLoopOn=false;
const boltCv=document.querySelector('#reveal .rv-bolt'),bctx=boltCv.getContext('2d');
function genBolt(x1,y1,x2,y2,col,depthLvl=0){
  let pts=[[x1,y1],[x2,y2]],off=Math.hypot(x2-x1,y2-y1)*.32;
  for(let it=0;it<6;it++){
    const np=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const[ax,ay]=pts[i],[bx,by]=pts[i+1];
      np.push([(ax+bx)/2+(Math.random()-.5)*off,(ay+by)/2+(Math.random()-.5)*off*.35],pts[i+1]);
    }
    pts=np;off*=.52;
  }
  const branches=[];
  if(depthLvl<1)for(let k=0;k<4;k++)if(Math.random()<.65){
    const i=Math.floor(rand(pts.length*.15,pts.length*.75)),[sx,sy]=pts[i];
    const len=Math.hypot(x2-x1,y2-y1)*rand(.15,.35),ang=Math.atan2(y2-y1,x2-x1)+rand(-1,1);
    branches.push(genBolt(sx,sy,sx+Math.cos(ang)*len,sy+Math.sin(ang)*len,col,1).pts);
  }
  return{pts,branches,col,life:1,decay:rand(2.2,3.2)};
}
function strokeBolt(c,b){
  const a=Math.max(0,Math.min(1,b.life*1.4))*(Math.random()<.25?.35:1); // мерцание
  const path=pts=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts)c.lineTo(q[0],q[1]);};
  c.save();c.globalAlpha=a;c.lineJoin='round';c.lineCap='round';
  c.shadowColor=b.col;c.shadowBlur=28;c.strokeStyle=b.col;
  c.lineWidth=9;path(b.pts);c.stroke();
  c.lineWidth=3.5;b.branches.forEach(br=>{path(br);c.stroke();});
  c.shadowBlur=12;c.shadowColor='#fff';c.strokeStyle='#fff';
  c.lineWidth=3.2;path(b.pts);c.stroke();
  c.lineWidth=1.3;b.branches.forEach(br=>{path(br);c.stroke();});
  c.restore();
}
const boltColor=()=>[`#9fd8ff`,`#c9a0ff`,`#fff59f`,`hsl(${Math.random()*360|0},100%,70%)`][Math.random()*4|0];
function strikeOverlay(n,toNumber=true){
  const el=$('reveal'),er=el.getBoundingClientRect(),nr=el.querySelector('.rv-num').getBoundingClientRect();
  for(let i=0;i<n;i++){
    let tx,ty;
    if(toNumber&&nr.width>0){tx=nr.left-er.left+rand(0,nr.width);ty=nr.top-er.top+rand(nr.height*.1,nr.height*.6);}
    else{tx=rand(0,er.width);ty=er.height*rand(.55,1);}
    rvBolts.push(genBolt(tx+rand(-er.width*.25,er.width*.25),-10,tx,ty,boltColor()));
  }
  const w=el.querySelector('.rv-white');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');
  thunder(Math.min(1.6,.6+n*.2));
  shakeWrap(n>=3);
  startBoltLoop();
}
function strikeAnimal(a,n){
  if(!animals.includes(a))return;
  const s=depth(a.y),bx=a.x,by=a.y-a.def.size*s*.4;
  for(let i=0;i<n;i++)gameBolts.push(genBolt(bx+rand(-120,120),-10,bx+rand(-6,6),by,boltColor()));
  gameFlash=.75;thunder(1.3);shakeWrap(true);
  burst(bx,by,'#fff',50);burst(bx,by,'#9fd8ff',40);
}
function shakeWrap(big){const g=$('frame'),c=big?'shake2':'shake';g.classList.remove('shake','shake2');void g.offsetWidth;g.classList.add(c);}
function startBoltLoop(){
  if(boltLoopOn)return;boltLoopOn=true;
  let last=performance.now();
  (function f(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const w=boltCv.clientWidth,h=boltCv.clientHeight;
    if(boltCv.width!==w||boltCv.height!==h){boltCv.width=w;boltCv.height=h;}
    bctx.clearRect(0,0,w,h);
    // шторм: случайные удары
    if(storm>0&&Math.random()<dt*(storm===1?1.6:storm===2?5:10)){
      rvBolts.push(genBolt(rand(0,w),-10,rand(0,w),h*rand(.5,1),boltColor()));
      if(Math.random()<.5)thunder(.5);
    }
    rvBolts.forEach(b=>{b.life-=dt*b.decay;strokeBolt(bctx,b);});
    rvBolts=rvBolts.filter(b=>b.life>0);
    if(revealing||rvBolts.length)requestAnimationFrame(f);
    else{boltLoopOn=false;bctx.clearRect(0,0,w,h);}
  })(last);
}
function thunder(power=1){
  if(muted)return;const a=ac();if(!a)return;
  const len=1.2+power,buf=a.createBuffer(1,a.sampleRate*len|0,a.sampleRate),d=buf.getChannelData(0);
  let lp=0;for(let i=0;i<d.length;i++){const t=i/d.length;lp+=(Math.random()*2-1-lp)*.08;d[i]=(i<a.sampleRate*.05?(Math.random()*2-1):lp*3)*Math.pow(1-t,1.6);}
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3000,a.currentTime);f.frequency.exponentialRampToValueAtTime(150,a.currentTime+.7);
  const g=a.createGain();g.gain.value=.45*Math.min(1.6,power);
  src.connect(f).connect(g).connect(a.destination);src.start();
}
function sparkle(){[0,4,7,12,16].forEach((n,i)=>beep(1046*Math.pow(2,n/12),.12,'sine',.05,i*.045));}

const HYPE=['', '🌈 ОЧЕНЬ РЕДКО 🌈','⚡ НЕВЕРОЯТНО ⚡','⚡⚡ ФЕНОМЕНАЛЬНО ⚡⚡','🌩️ ОДИН НА МИЛЛИОН 🌩️','💀 НЕВОЗМОЖНО 💀'];

function playReveal(a){
  const el=$('reveal'),d=a.def,R=RAR[d.r],M=a.mut?MUT[a.mut]:null;
  const c1=R.c,c2=M?M.c:R.c;
  el.style.setProperty('--c',M&&d.r<3?M.c:c1);el.style.setProperty('--c2',c2);
  el.classList.toggle('rainbow',a.mut==='rainbow');el.classList.remove('storm','void');
  el.querySelector('.rv-top').textContent=a.test?'👻 ПРИМЕР — ЭТО НЕ НАСТОЯЩИЙ ЗВЕРЬ 👻':(M&&d.r<3)?'🧬 МУТАЦИЯ! 🧬':`✦ ${R.nn} ПОЯВЛЕНИЕ ✦`;
  const em=el.querySelector('.rv-emoji');em.innerHTML=`<span class="${mutCls(a.mut)}" style="display:inline-block">${d.e}</span>`;
  el.querySelector('.rv-name').textContent=(M?M.icon+' ':'')+d.n;
  const num=el.querySelector('.rv-num');num.textContent='1';num.className='rv-num';num.style.transform='';
  el.querySelector('.rv-one').className='rv-one';
  const hype=el.querySelector('.rv-hype');hype.textContent='';hype.className='rv-hype';
  const tags=el.querySelector('.rv-tags');tags.classList.remove('show');
  tags.innerHTML=`<span style="background:${R.c}">${R.n}</span>`+
    (M?`<span class="${M.id==='rainbow'?'mutTag rainbow':''}" style="background:${M.c}">🧬 ${M.n} ×${M.mult}</span>`:'');
  storm=0;rvBolts=[];
  el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  startBoltLoop();
  beep(180,.25,'sawtooth',.05);
  const lvl=Math.log10(a.odds);
  let tier=0;
  const finalTier=TIERS.filter(t=>a.odds>=t).length;
  const rollDur=900+Math.min(3200,lvl*480);
  const hold=1100+Math.min(1500,lvl*200)+finalTier*450;
  setTimeout(()=>rollCounter(num,a.odds,rollDur,v=>{
    while(tier<TIERS.length&&v>=TIERS[tier]){tier++;tierUp(tier,el,num);}
  },()=>{
    num.classList.add('slam');tags.classList.add('show');
    fanfare(d.r,!!M);
    if(finalTier>=2)strikeOverlay(1+finalTier);           // финальный удар прямо в цифры
    else if(lvl>=2.5)shakeWrap(false);
    if(animals.includes(a)){const s=depth(a.y);burst(a.x,a.y-a.def.size*s*.4,c2,30+Math.min(90,lvl*15));}
    setTimeout(()=>{
      el.classList.remove('on');storm=0;a.hl=5;
      if(finalTier>=2)setTimeout(()=>strikeAnimal(a,finalTier-1),150); // молния бьёт в само животное на поле
      setTimeout(nextReveal,finalTier>=2?1100:450);
    },hold);
  }),550);
}
function rollCounter(el,N,dur,onVal,done){
  const t0=performance.now(),lnN=Math.log(N);let shown=1,lastTick=0;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    const v=Math.max(1,Math.round(Math.exp(lnN*e)));
    el.style.transform=`scale(${1+e*.25}) rotate(${(Math.random()-.5)*e*4}deg)`;
    if(v!==shown){shown=v;el.textContent=fmtOdds(v);onVal(v);
      if(now-lastTick>50){beep(260+700*e,.035,'square',.025);lastTick=now;}}
    if(p<1)requestAnimationFrame(step);
    else{el.textContent=fmtOdds(N);onVal(N);el.style.transform='';done();}
  })(t0);
}

const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const b64uEnc=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const TE=new TextEncoder(),TD=new TextDecoder();

class MiniMQTT{
  constructor(urls,cid,onMsg,onState){Object.assign(this,{urls,cid,onMsg,onState});this.ui=0;this.subs=[];this.buf=new Uint8Array(0);this.pid=1;this.ok=false;this.retry=1500;}
  str(x){const b=TE.encode(x);return[b.length>>8,b.length&255,...b];}
  pk(h,vh,pl=[]){const body=[...vh,...pl];let n=body.length;const len=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d);}while(n>0);return new Uint8Array([h,...len,...body]);}
  connect(){
    const url=this.urls[this.ui%this.urls.length];let ws;
    try{ws=new WebSocket(url,['mqtt']);}catch(e){this.ui++;return setTimeout(()=>this.connect(),3000);}
    this.ws=ws;ws.binaryType='arraybuffer';this.buf=new Uint8Array(0);this.onState('wait');
    const to=setTimeout(()=>{if(!this.ok)try{ws.close();}catch(e){}},9000);
    ws.onopen=()=>ws.send(this.pk(0x10,[...this.str('MQTT'),4,0x02,0,60],this.str(this.cid)));
    ws.onmessage=e=>this.data(new Uint8Array(e.data));
    ws.onerror=()=>{};
    ws.onclose=()=>{clearTimeout(to);clearInterval(this.ping);const was=this.ok;this.ok=false;this.onState('off');
      if(!was)this.ui++;setTimeout(()=>this.connect(),was?1500:(this.retry=Math.min(this.retry*1.5,20000)));};
  }
  data(chunk){
    const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    while(this.buf.length>=2){
      let mul=1,len=0,i=1,d;
      do{if(i>=this.buf.length)return;d=this.buf[i++];len+=(d&127)*mul;mul*=128;}while(d&128);
      if(this.buf.length<i+len)return;
      const type=this.buf[0]>>4,flags=this.buf[0]&15,p=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);
      if(type===2){if(p[1]===0){this.ok=true;this.retry=1500;this.subs.forEach(t=>this.sendSub(t));
          this.ping=setInterval(()=>this.raw([0xC0,0]),25000);this.onState('on');}}
      else if(type===3){const tl=(p[0]<<8)|p[1],topic=TD.decode(p.subarray(2,2+tl));let o=2+tl;if((flags>>1)&3)o+=2;
        try{this.onMsg(topic,TD.decode(p.subarray(o)));}catch(e){console.warn(e);}}
    }
  }
  raw(a){if(this.ws&&this.ws.readyState===1)this.ws.send(new Uint8Array(a));}
  sendSub(t){this.pid=(this.pid%65000)+1;this.ws.send(this.pk(0x82,[this.pid>>8,this.pid&255],[...this.str(t),0]));}
  subscribe(t){this.subs.push(t);if(this.ok)this.sendSub(t);}
  publish(t,msg,retain){if(!this.ok||this.ws.readyState!==1)return false;this.ws.send(this.pk(0x30|(retain?1:0),this.str(t),[...TE.encode(msg)]));return true;}
}

const okStr=(v,n)=>typeof v==='string'?v.slice(0,n):'';
const okNum=v=>Number.isFinite(+v)?+v:0;
function netMsg(topic,txt){
  if(txt.length>6000)return;
  if(topic.startsWith(T+'/p/')){
    const id=topic.slice(T.length+3);
    if(!txt){delete players[id];return;}
    let m;try{m=JSON.parse(txt);}catch(e){return;}
    const now=Date.now();
    players[id]={id,n:okStr(m.n,16)||'???',ts:okNum(m.ts),inc:okNum(m.inc),c:okNum(m.c),l:okNum(m.l),adm:!!m.adm,
      b:(m.b&&DEF[m.b.a])?{a:m.b.a,m:MUT[m.b.m]?m.b.m:null,o:okNum(m.b.o)}:null,
      on:m.on!==false&&Math.abs(now-okNum(m.ts))<600000,seen:now};
    return;
  }
  let m;try{m=JSON.parse(txt);}catch(e){return;}
  if(!m||typeof m!=='object')return;
  if(topic===T+'/feed')onFeed(m);
  else if(topic===T+'/admin'||topic.startsWith(T+'/ev/'))onAdminMsg(m);
}
function onFeed(m){

  else if(m.t==='hl'){const h=HL[m.h];if(!h)return;
    addFeed(`🔓 <b>${esc(name)}</b> открыл секретное лассо <span style="color:#e9b6ff">${h.ic} ${h.n}</span>!`,'catch');
    if(m.id!==ME.id)toast(`🔓 ${esc(name)} открыл секретное лассо ${h.ic} ${h.n}!`,'#e9b6ff');}
  else if(m.t==='catch'){
    const d=DEF[m.a];if(!d)return;const mut=MUT[m.m]?m.m:null,o=Math.max(1,okNum(m.o)|0),R=RAR[d.r];
    const what=`${mut?MUT[mut].icon+' ':''}${d.e} <span style="color:${mutCol(mut,R)}">${esc(d.n)}</span>`;

    if(m.id!==ME.id&&o>=1000)toast(`🌍 ${esc(name)} поймал ${what} — 1 из ${fmtOdds(o)}!`,mutCol(mut,R));
  }
}

let adminKey=null;const seenNonce=new Set();let pubKeyObj=null;
async function tryAdmin(code){
  try{
    code=String(code).trim().toUpperCase();if(!code)return false;
    const seed=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode(code)));
    const prefix=[0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20];
    const k=await crypto.subtle.importKey('pkcs8',new Uint8Array([...prefix,...seed]),{name:'Ed25519'},true,['sign']);
    const j=await crypto.subtle.exportKey('jwk',k);
    if(j.x!==ADMIN_PUB)return false;
    adminKey=await crypto.subtle.importKey('pkcs8',new Uint8Array([...prefix,...seed]),{name:'Ed25519'},false,['sign']);
    localStorage.setItem('lr_admin',code);
    $('tabAdminBtn').style.display='';renderAdmin();pubProfile();
    return true;
  }catch(e){console.warn(e);return'nosupport';}
}
function adminResult(ok){
  if(ok===true){toast('👑 Админ-доступ открыт! Вкладка «👑» справа.','#ffcf3f');$('tabAdminBtn').click();}
  else if(ok==='nosupport')toast('Браузер не поддерживает подписи Ed25519 — обнови браузер');
  else toast('❌ Неверный код');
}
function adminPrompt(){const c=prompt('Введи админ-код:');if(c)tryAdmin(c).then(adminResult);}
function admLogout(){adminKey=null;localStorage.removeItem('lr_admin');$('tabAdminBtn').style.display='none';document.querySelector('.tabs button[data-tab=online]').click();pubProfile();toast('Ты вышел из админки');}
async function adminSend(obj,topic=`${T}/admin`,retain=false){
  if(!adminKey){toast('Нет админ-доступа');return;}
  const c={...obj,ts:Date.now(),nonce:Math.random().toString(36).slice(2,12)};
  const d=JSON.stringify(c);
  const sig=new Uint8Array(await crypto.subtle.sign({name:'Ed25519'},adminKey,TE.encode(d)));
  const ok=net&&net.publish(topic,JSON.stringify({d,s:b64uEnc(sig)}),retain);
  if(!ok){runAdmin(c,true);toast('⚠️ Нет связи — команда сработала только у тебя');}
}
async function onAdminMsg(m){
  if(typeof m.d!=='string'||typeof m.s!=='string'||m.d.length>2000)return;
  try{
    if(!pubKeyObj)pubKeyObj=await crypto.subtle.importKey('raw',b64u(ADMIN_PUB),{name:'Ed25519'},false,['verify']);
    if(!await crypto.subtle.verify({name:'Ed25519'},pubKeyObj,b64u(m.s),TE.encode(m.d)))return;
  }catch(e){return;}
  let c;try{c=JSON.parse(m.d);}catch(e){return;}
  if(seenNonce.has(c.nonce))return;seenNonce.add(c.nonce);
  const fresh=Math.abs(Date.now()-c.ts)<120000;
  if(c.cmd==='event')runAdmin(c,fresh);
  else if(fresh)runAdmin(c,true);
}
function runAdmin(c,fresh){
  if(c.cmd==='event'&&EVENTS[c.type]){
    const was=evOn(c.type);
    EVENTS[c.type]={mult:clamp(okNum(c.mult),1,10),until:okNum(c.until)};
    const nm=c.type==='luck'?'🍀 Ивент удачи':'🧬 Ивент мутаций';
    if(evOn(c.type)){if(fresh){toast(`👑 ${nm} ×${EVENTS[c.type].mult} на ${Math.round((c.until-Date.now())/60000)} мин!`,'#ffcf3f');addFeed(`👑 Админ запустил: ${nm} ×${EVENTS[c.type].mult}`,'adm');fanfare(5,true);}}
    else if(was){toast(`${nm} завершён`);}
    evWatch(true);
  }else if(c.cmd==='spawn'&&DEF[c.id]){
    spawnSpecific(c.id,MUT[c.mut]?c.mut:null);addFeed(`👑 Админ призвал всем: ${DEF[c.id].e} ${esc(DEF[c.id].n)}`,'adm');
  }else if(c.cmd==='block'&&LB[c.type]){
    const n=clamp(okNum(c.n)|0,1,10);for(let i=0;i<n;i++)setTimeout(()=>spawnBlock(c.type),i*180);
    toast(`👑 Админ сбросил ${LB[c.type].ic} ${LB[c.type].n}${n>1?' ×'+n:''}! Лови лассо!`,lbCol(LB[c.type]),true);
    addFeed(`👑 Админ сбросил всем: ${LB[c.type].ic} ${LB[c.type].n}${n>1?' ×'+n:''}`,'adm');
  }else if(c.cmd==='money'){
    const v=clamp(okNum(c.amount),0,1e15);S.money+=v;toast(`👑 Админ подарил всем ${fmt(v)} $!`,'#ffcf3f',true);coinSound();
    floatText(HAND.x,HAND.y-90,'+'+fmt(v)+' $','#ffe14d',true);confetti(W/2,FIELD_TOP,80);addFeed(`👑 Админ подарил всем ${fmt(v)} $`,'adm');
  }else if(c.cmd==='say'){
    const x=okStr(c.text,140);toast('📢 '+esc(x),'#ffcf3f',true);addFeed('📢 '+esc(x),'adm');beep(660,.15,'triangle',.06);beep(880,.25,'triangle',.06,.12);
  }
}
